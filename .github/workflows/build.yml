# 깃허브의 맥 서버가 대신 빌드해 주는 설정입니다. (윈도우만 있어도 아이폰 앱 파일을 얻는 방법)
# tadak 브랜치에 올릴 때마다 자동 실행됩니다.
name: Build iOS app
on:
  push:
    branches: [tadak]
  workflow_dispatch:

permissions:
  contents: write   # 완성된 IPA를 Releases 에 올리기 위해 필요

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (서명 없이)
        run: |
          set -o pipefail
          xcodebuild -project Tadak.xcodeproj -scheme Tadak -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Tadak.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tadak.app Payload/
          zip -qry Tadak-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tadak-unsigned-ipa
          path: Tadak-unsigned.ipa

      # Releases 에 올려 두면 로그인 없이 한 번에 받을 수 있는 고정 주소가 생긴다
      - name: Publish IPA to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Tadak-unsigned.ipa Tadak.ipa
          gh release delete tadak-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create tadak-latest Tadak.ipa --target "$GITHUB_SHA" \
            --title "타닥 키보드 (빌드 #${{ github.run_number }})" \
            --notes "서명 안 된 IPA 입니다. Sideloadly 로 아이폰에 설치하세요."

      - name: Upload build log (실패했을 때 원인 확인용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
